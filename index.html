<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اسلامي پښتو AI</title>

<style>
:root {
    --bg: #061a14;
    --panel: #0b281e;
    --panel2: #103629;
    --green: #18c78b;
    --green2: #0d9f6b;
    --text: #effff7;
    --muted: #a6c7b7;
    --border: rgba(255,255,255,.09);
    --danger: #ff6868;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Tahoma, sans-serif;
    min-height: 100vh;
}

button, input, textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    height: 100dvh;
    max-width: 1100px;
    margin: auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background:
        radial-gradient(circle at top right, rgba(24,199,139,.07), transparent 35%),
        var(--bg);
}

/* HEADER */

.header {
    height: 64px;
    min-height: 64px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 15px;
    border-bottom: 1px solid var(--border);
    background: rgba(6,26,20,.95);
}

.icon-btn {
    width: 42px;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--panel);
    color: var(--text);
    font-size: 21px;
    display: grid;
    place-items: center;
}

.logo {
    width: 39px;
    height: 39px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background: linear-gradient(145deg, #20d99a, #08744f);
    color: #03281b;
    font-size: 22px;
}

.header-title {
    flex: 1;
    min-width: 0;
}

.header-title h1 {
    font-size: 16px;
    font-weight: 700;
}

.header-title p {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
}

.status {
    width: 8px;
    height: 8px;
    display: inline-block;
    background: var(--green);
    border-radius: 50%;
    margin-left: 5px;
}

/* CHAT */

.chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 22px 16px 25px;
    scroll-behavior: smooth;
}

.welcome {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px 0;
}

.welcome-logo {
    width: 78px;
    height: 78px;
    border-radius: 25px;
    display: grid;
    place-items: center;
    font-size: 40px;
    color: #042719;
    background: linear-gradient(145deg, #36e9aa, #08764f);
    box-shadow: 0 10px 40px rgba(24,199,139,.15);
    margin-bottom: 23px;
}

.welcome h2 {
    font-size: 25px;
    margin-bottom: 12px;
}

.welcome p {
    max-width: 440px;
    line-height: 1.9;
    font-size: 14px;
    color: var(--muted);
}

.suggestions-grid {
    width: 100%;
    max-width: 650px;
    margin-top: 28px;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 11px;
}

.suggestion-card {
    border: 1px solid var(--border);
    border-radius: 15px;
    background: linear-gradient(145deg, var(--panel), #091f17);
    padding: 15px;
    text-align: right;
    color: var(--text);
    line-height: 1.7;
    font-size: 13px;
    transition: .2s;
}

.suggestion-card:hover {
    border-color: var(--green);
    background: var(--panel2);
}

.suggestion-card span {
    display: block;
    font-size: 21px;
    margin-bottom: 7px;
}

/* MESSAGES */

.message {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 23px;
    animation: appear .25s ease;
}

.message.user {
    flex-direction: row-reverse;
}

.avatar {
    width: 35px;
    height: 35px;
    min-width: 35px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: var(--panel2);
    font-size: 17px;
}

.message.assistant .avatar {
    color: #05281b;
    background: var(--green);
}

.bubble-wrap {
    max-width: 85%;
    min-width: 0;
}

.sender {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 7px;
}

.bubble {
    padding: 13px 15px;
    border: 1px solid var(--border);
    border-radius: 16px;
    line-height: 2;
    font-size: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user .bubble {
    background: #104d38;
    border-color: rgba(24,199,139,.15);
    border-top-right-radius: 4px;
}

.assistant .bubble {
    background: #0b281e;
    border-top-left-radius: 4px;
}

.bubble strong {
    color: #54e9ae;
}

.answer-section {
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
}

.answer-section:last-child {
    border-bottom: none;
}

.answer-section h3 {
    color: #55e9af;
    font-size: 14px;
    margin-bottom: 6px;
}

.choice-list {
    margin-top: 10px;
    display: grid;
    gap: 7px;
}

.choice-btn {
    width: 100%;
    text-align: right;
    padding: 10px 12px;
    background: #103629;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    line-height: 1.7;
}

.choice-btn:hover {
    border-color: var(--green);
}

.small-note {
    color: var(--muted);
    font-size: 12px;
    margin-top: 10px;
    line-height: 1.8;
}

.typing {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 8px 0;
}

.typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    animation: bounce .8s infinite alternate;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

/* INPUT */

.input-area {
    padding: 12px 14px 15px;
    background: rgba(6,26,20,.98);
    border-top: 1px solid var(--border);
}

.input-box {
    max-width: 850px;
    margin: auto;
    display: flex;
    align-items: flex-end;
    gap: 9px;
    border: 1px solid #245340;
    border-radius: 18px;
    background: #0b281e;
    padding: 9px;
    transition: .2s;
}

.input-box:focus-within {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(24,199,139,.06);
}

#userInput {
    flex: 1;
    min-width: 0;
    max-height: 130px;
    min-height: 43px;
    resize: none;
    outline: none;
    border: none;
    background: transparent;
    color: var(--text);
    padding: 11px 8px;
    line-height: 1.7;
    font-size: 14px;
}

#userInput::placeholder {
    color: #83a998;
}

.send-btn {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    border: none;
    border-radius: 13px;
    background: var(--green);
    color: #03291c;
    font-size: 20px;
    font-weight: bold;
}

.send-btn:disabled {
    opacity: .5;
}

.footer-note {
    text-align: center;
    color: #759988;
    font-size: 10px;
    margin-top: 9px;
}

/* SIDEBAR */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 10;
    display: none;
}

.overlay.show {
    display: block;
}

.sidebar {
    position: fixed;
    z-index: 11;
    top: 0;
    bottom: 0;
    right: 0;
    width: min(320px, 86vw);
    background: #081f17;
    border-left: 1px solid var(--border);
    transform: translateX(105%);
    transition: transform .25s ease;
    display: flex;
    flex-direction: column;
}

.sidebar.open {
    transform: translateX(0);
}

.sidebar-header {
    padding: 19px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
}

.sidebar-header h2 {
    font-size: 17px;
}

.sidebar-actions {
    padding: 13px;
    display: grid;
    gap: 9px;
}

.side-btn {
    padding: 12px;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    text-align: right;
}

.side-btn.primary {
    background: var(--green);
    color: #03291c;
    font-weight: bold;
}

.history-title {
    padding: 10px 16px;
    font-size: 12px;
    color: var(--muted);
}

.history-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 10px 15px;
}

.history-item {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 7px;
}

.history-open {
    flex: 1;
    min-width: 0;
    padding: 11px;
    border-radius: 10px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text);
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
}

.history-open.active {
    background: #103629;
    border-color: rgba(24,199,139,.2);
}

.history-menu {
    width: 34px;
    height: 36px;
    border: none;
    background: transparent;
    color: var(--muted);
    border-radius: 8px;
    font-size: 19px;
}

.history-menu:hover {
    background: var(--panel2);
}

.empty-history {
    text-align: center;
    padding: 25px 10px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.8;
}

.toast {
    position: fixed;
    z-index: 30;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: #174633;
    color: white;
    border: 1px solid #28644a;
    padding: 11px 17px;
    border-radius: 12px;
    font-size: 13px;
    display: none;
    max-width: 90%;
    text-align: center;
}

.toast.show {
    display: block;
    animation: appear .2s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes bounce {
    from { transform: translateY(0); opacity: .5; }
    to { transform: translateY(-5px); opacity: 1; }
}

@media (max-width: 520px) {
    .header {
        padding: 0 10px;
        gap: 8px;
    }

    .header-title h1 {
        font-size: 14px;
    }

    .header-title p {
        font-size: 10px;
    }

    .chat-area {
        padding: 18px 11px;
    }

    .welcome h2 {
        font-size: 22px;
    }

    .suggestions-grid {
        gap: 8px;
    }

    .suggestion-card {
        padding: 11px;
        font-size: 12px;
    }

    .bubble-wrap {
        max-width: 88%;
    }

    .bubble {
        font-size: 13px;
        padding: 11px 12px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <button class="icon-btn" id="menuBtn" aria-label="مینو">☰</button>

        <div class="logo">☪</div>

        <div class="header-title">
            <h1>اسلامي پښتو AI</h1>
            <p><span class="status"></span> محلي اسلامي مرستیال</p>
        </div>

        <button class="icon-btn" id="newChatBtn" aria-label="نوې خبرې">＋</button>
    </header>

    <main class="chat-area" id="chatArea">
        <section class="welcome" id="welcome">
            <div class="welcome-logo">☪</div>
            <h2>السلام علیکم!</h2>
            <p>
                اسلامي پښتو مرستیال ته ښه راغلاست.
                خپله پوښتنه ولیکئ؛ زه به د موجودو معلوماتو له مخې
                د ځواب هڅه وکړم.
            </p>

            <div class="suggestions-grid">
                <button class="suggestion-card" data-question="اسلام څه شی دی؟">
                    <span>📖</span>
                    اسلام څه شی دی؟
                </button>

                <button class="suggestion-card" data-question="قرآن کریم څه شی دی؟">
                    <span>📗</span>
                    قرآن کریم څه شی دی؟
                </button>

                <button class="suggestion-card" data-question="د اسلام پنځه ارکان کوم دي؟">
                    <span>🕌</span>
                    د اسلام پنځه ارکان
                </button>

                <button class="suggestion-card" data-question="اودس څنګه کیږي؟">
                    <span>💧</span>
                    د اوداسه طریقه
                </button>
            </div>
        </section>

        <div id="messages"></div>
    </main>

    <footer class="input-area">
        <form class="input-box" id="chatForm">
            <textarea
                id="userInput"
                rows="1"
                placeholder="خپله پوښتنه دلته ولیکئ..."
                aria-label="خپله پوښتنه ولیکئ"
            ></textarea>

            <button class="send-btn" id="sendBtn" type="submit" aria-label="لېږل">
                ➤
            </button>
        </form>

        <div class="footer-note">
            د مهمو شرعي مسایلو لپاره له باوري عالم سره هم مشوره وکړئ.
        </div>
    </footer>

</div>

<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <h2>☪ د خبرو تاریخچه</h2>
        <button class="icon-btn" id="closeMenuBtn" aria-label="بندول">×</button>
    </div>

    <div class="sidebar-actions">
        <button class="side-btn primary" id="sidebarNewBtn">＋ نوې خبرې</button>
        <button class="side-btn" id="renameBtn">✏️ د خبرو نوم بدلول</button>
        <button class="side-btn" id="deleteCurrentBtn">🗑️ دا خبرې حذف کول</button>
        <button class="side-btn" id="deleteAllBtn">حذف ټولې خبرې</button>
    </div>

    <div class="history-title">پخوانۍ خبرې</div>
    <div class="history-list" id="historyList"></div>
</aside>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* =====================================================
   1. د اسلامي معلوماتو محلي بانک
   ===================================================== */

const knowledgeBase = [

{
    id: 1,
    question: "اسلام څه شی دی",
    keywords: ["اسلام", "دین", "مسلمان", "اسلام تعریف"],
    answer:
"اسلام د الله تعالی د یووالي منل، د هغه عبادت کول او د هغه د رسولانو پیروي کول دي. د اسلام اساسي پیغام د الله تعالی عبادت، نېک عمل، عدالت، رحمت او د خلکو د حقونو مراعاتول دي."
},

{
    id: 2,
    question: "قرآن کریم څه شی دی",
    keywords: ["قرآن", "قران", "قرآن کریم", "کتاب الله", "اسماني کتاب"],
    answer:
"قرآن کریم د اسلام سپېڅلی کتاب دی چې مسلمانان یې د الله تعالی کلام بولي. دا د حضرت محمد ﷺ پر زړه نازل شوی. قرآن کریم ۱۱۴ سورتونه لري. د آیتونو د دقیق شمېر او تفسیر په اړه باید باوري قرآني سرچینو ته مراجعه وشي."
},

{
    id: 3,
    question: "حضرت محمد ﷺ څوک و",
    keywords: ["محمد", "رسول الله", "پیغمبر", "نبي", "حضرت محمد"],
    answer:
"حضرت محمد ﷺ د اسلام وروستی پیغمبر دی. مسلمانان پر هغه ایمان لري او د هغه سنت د خپل ژوند لپاره لارښود ګڼي. هغه په مکه مکرمه کې زېږېدلی او وروسته مدینې منورې ته هجرت کړی."
},

{
    id: 4,
    question: "د اسلام پنځه ارکان کوم دي",

{

},

{
    id: 6,
    question: "الله تعالی څوک دی",
    keywords: ["الله", "رب", "خالق", "خدای", "الله تعالی"],
    answer:
"الله تعالی د اسلام له نظره د ټولو مخلوقاتو خالق او یوازینی معبود دی. مسلمانان باور لري چې هغه یو دی، شریک نه لري او د عبادت وړ یوازې هماغه دی."
},

{
    id: 7,

},

{
    id: 10,
    question: "اودس څنګه کیږي",
    keywords: ["اودس", "اوداسه", "وضو", "اودس طریقه"],
    answer:
"د اوداسه عمومي طریقه دا ده:\n۱. د اوداسه نیت وکړئ.\n۲. لاسونه ومینځئ.\n۳. خوله او پوزه ووینځئ.\n۴. مخ ووینځئ.\n۵. لاسونه تر څنګلو پورې ووینځئ.\n۶. د سر مسح وکړئ.\n۷. پښې تر ښنګرو پورې ووینځئ.\n\nد فرضونو، سنتونو او ترتیب په تفصیل کې د فقهي مذهبونو ترمنځ ځینې توپیرونه شته."
},

{
    id: 11,
    question: "روژه څه شی ده",
    keywords: ["روژه", "صوم", "رمضان", "روژه نیول"],
    answer:
"روژه د الله تعالی د عبادت لپاره له سهار صادق څخه تر لمر لوېدو پورې له خوراک، څښاک او نورو روژه ماتوونکو کارونو څخه ځان ساتلو ته ویل کېږي. د ناروغۍ، سفر او نورو ځانګړو حالتونو احکام جلا تفصیل لري."
},

{
    id: 12,
    question: "زکات څه شی دی",

const STORAGE_KEY = "pashto_islamic_ai_chats_v3";

let chats = [];
let currentChatId = null;

/*
 هره مبهمه پوښتنه خپل جلا انتخابونه لري.
 که په یوه پیغام کې دوه مبهمې پوښتنې وي،
 د شمېرې انتخابونه به په خپل ترتیب حل کېږي.
*/
let pendingChoices = [];

let isBusy = false;

const chatArea = document.getElementById("chatArea");

function makeId() {
    return Date.now().toString(36) +
        Math.random().toString(36).slice(2, 8);
}

function now() {
    return new Date().toISOString();
}

function loadChats() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        const parsed = saved ? JSON.parse(saved) : [];

        if (Array.isArray(parsed)) {
            chats = parsed;
        } else {
            chats = [];
        }
    } catch (error) {
        chats = [];
    }

    chats = chats.filter(chat =>
        chat &&
        typeof chat.id === "string" &&
        Array.isArray(chat.messages)
    );

    chats.forEach(chat => {
        if (!chat.title) chat.title = "نوې خبرې";
        if (!chat.createdAt) chat.createdAt = now();
        if (!chat.updatedAt) chat.updatedAt = chat.createdAt;
    });
}

function saveChats() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
    } catch (error) {
        showToast("د ذخیرې ستونزه: د موبایل حافظه وګورئ.");
    }
}

function getCurrentChat() {
    return chats.find(chat => chat.id === currentChatId) || null;
}

function createChat() {
    const chat = {
        id: makeId(),
        title: "نوې خبرې",
        createdAt: now(),
        updatedAt: now(),
        messages: []
    };

    chats.unshift(chat);
    currentChatId = chat.id;
    pendingChoices = [];

    saveChats();
    renderChat();
    renderHistory();
    closeSidebar();

    return chat;
}

function ensureChat() {
    let chat = getCurrentChat();

    if (!chat) {
        chat = createChat();
    }

    return chat;
}

/* =====================================================
   3. د متن پاکول او د پښتو عددونو پېژندل
   ===================================================== */

function convertDigitsToEnglish(text) {
    const map = {
        "۰": "0",
        "۱": "1",
        "۲": "2",
        "۳": "3",
        "۴": "4",
        "۵": "5",
        "۶": "6",
        "۷": "7",
        "۸": "8",
        "۹": "9"
    };

    return String(text).replace(/[۰-۹]/g, digit => map[digit]);
}

function normalize(text) {
    return convertDigitsToEnglish(String(text || ""))
        .toLowerCase()
        .replace(/[ًٌٍَُِّْٰـ]/g, "")
        .replace(/[إأآٱ]/g, "ا")
        .replace(/ى/g, "ي")
        .replace(/ک/g, "ك")
        .replace(/ي/g, "ی")
        .replace(/ة/g, "ه")
        .replace(/[؟?!.,،؛:()[\]{}"'«»ـ\-]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}

function tokenize(text) {
    return normalize(text)
        .split(/\s+/)
        .filter(Boolean);
}

const stopWords = new Set([
    "څه", "څوک", "څنګه", "ولې", "چیرته", "کوم", "کومه",
    "دی", "ده", "دي", "شو", "شي", "کوي", "کړي", "کړه",
    "د", "په", "کې", "له", "نه", "او", "یا", "را", "زه",
    "ته", "تاسو", "موږ", "زما", "ستا", "ستاسو", "یې",
    "دا", "هغه", "هم", "خو", "چې", "به", "و", "وو",
    "لري", "لره", "یې", "رانه", "کوم", "مهرباني",
    "ماته", "راته", "وایه", "ووایه", "تشریح", "کړئ",
    "معنی", "مطلب", "تعریف", "کومه", "کومې"
]);

function meaningfulWords(text) {
    return tokenize(text).filter(word =>
        word.length > 1 && !stopWords.has(word)
    );
}

/* =====================================================
   4. د ورته والي حساب
   ===================================================== */

function similarity(a, b) {
    const wordsA = new Set(meaningfulWords(a));
    const wordsB = new Set(meaningfulWords(b));

    if (wordsA.size === 0 || wordsB.size === 0) {
        return 0;
    }

    let intersection = 0;

    for (const word of wordsA) {
        if (wordsB.has(word)) intersection++;
    }

    const union = new Set([...wordsA, ...wordsB]).size;

    const jaccard = intersection / union;
    const coverageA = intersection / wordsA.size;
    const coverageB = intersection / wordsB.size;

    return Math.max(
        jaccard,
        coverageA * 0.85,
        coverageB * 0.85
    );
}

function scoreEntry(query, entry) {
    const q = normalize(query);
    const mainQuestion = normalize(entry.question);

    if (q === mainQuestion) {
        return 1;
    }

    let score = similarity(q, entry.question);

    for (const keyword of (entry.keywords || [])) {
        const k = normalize(keyword);

        if (q === k) {
            score = Math.max(score, 1);
        } else if (k && q.includes(k)) {
            score = Math.max(score, 0.94);
        } else {
            score = Math.max(score, similarity(q, k) * 0.95);
        }
    }

    return score;
}

function findMatches(query) {
    return knowledgeBase
        .map(entry => ({
            entry,
            score: scoreEntry(query, entry)
        }))
        .sort((a, b) => b.score - a.score);
}

/* =====================================================
   5. د سلام او عامو خبرو پېژندل
   ===================================================== */

function getSmallTalk(query) {
    const q = normalize(query);

    const greetings = [
        "سلام",
        "السلام علیکم",
        "سلامونه",
        "وعلیکم السلام",
        "salam"
    ];

    if (greetings.some(item => q === normalize(item))) {
        return "وعلیکم السلام ورحمة الله وبرکاته! ښه راغلاست. خپله پوښتنه ولیکه، زه به د موجودو معلوماتو له مخې مرسته درسره وکړم.";
    }

    if (
        q === "مننه" ||
        q === "ډیره مننه" ||
        q === "ډېره مننه" ||
        q === "تشکر"
    ) {
        return "هر کله! الله تعالی دې درته خیر او برکت درکړي.";
    }

    if (
        q === "ته څنګه یې" ||
        q === "څنګه یې" ||
        q === "څنګه یاست"
    ) {
        return "مننه! زه چمتو یم چې ستا پوښتنو ته د موجودو معلوماتو له مخې ځواب ووایم.";
    }

    return null;
}

/* =====================================================
   6. د یوې پوښتنې حل کول
   ===================================================== */

function resolveSingleQuestion(question) {
    const q = normalize(question);

    if (!q) {
        return {
            type: "unknown",
            question,
            answer: ""
        };
    }

    const smallTalk = getSmallTalk(q);

    if (smallTalk) {
        return {
            type: "answer",
            question,
            answer: smallTalk
        };
    }

    const matches = findMatches(q);
    const best = matches[0];

    /*
      د ډېر قوي ورته والي په صورت کې مستقیم ځواب.
    */
    if (best && best.score >= 0.76) {
        return {
            type: "answer",
            question,
            answer: best.entry.answer,
            entryId: best.entry.id
        };
    }

    /*
      که پوښتنه نیمه ورته وي، د انتخابونو وړاندیز.
    */
    const suggestions = matches
        .filter(item => item.score >= 0.22)
        .slice(0, 5)
        .map(item => ({
            id: item.entry.id,
            question: item.entry.question,
            answer: item.entry.answer,
            score: item.score
        }));

    if (suggestions.length > 0) {
        return {
            type: "suggestions",
            question,
            suggestions
        };
    }

    return {
        type: "unknown",
        question,
        answer:
"بښنه غواړم، د دې پوښتنې لپاره په محلي معلوماتو کې مناسب ځواب پیدا نه شو. پوښتنه لږه روښانه ولیکه یا یې په بل ډول بیان کړه."
    };
}

/* =====================================================
   7. په یوه پیغام کې د څو پوښتنو جلا کول
   ===================================================== */

function splitQuestions(text) {
    let input = String(text || "").trim();

    if (!input) return [];

    // پښتو او انګلیسي د پوښتنې نښې، نقطې او نوې کرښې
    // د جلا کولو لپاره پېژني.
    let parts = input
        .split(/[؟?!؛;\n]+/)
        .map(part => part.trim())
        .filter(Boolean);

    const starters = [
        "اسلام",
        "قرآن",
        "قران",
        "الله",
        "رسول",
        "محمد",
        "ایمان",
        "لمونځ",
        "نماز",
        "اودس",
        "روژه",
        "زکات",
        "حج",
        "جنت",
        "دوزخ",
        "حدیث",
        "سنت",
        "توبه",
        "دعا",
        "استغفار",
        "مسلمان",
        "هجرت",
        "صدقه",
        "اخلاق",
        "درود",
        "حلال",
        "حرام",
        "جمعه",
        "اختر",
        "سورت",
        "سوره",
        "مور",
        "پلار",
        "ذکر"
    ];

    const output = [];

    for (const part of parts) {
        let segments = [part];

        for (const starter of starters) {
            const nextSegments = [];

            for (const segment of segments) {
                const escaped = starter.replace(
                    /[.*+?^${}()|[\]\\]/g,
                    "\\$&"
                );

                const regex = new RegExp(
                    "\\s+(او)\\s+(?=" + escaped + ")",
                    "g"
                );

                nextSegments.push(...segment.split(regex));
            }

            segments = nextSegments;
        }

        for (const segment of segments) {
            const clean = segment.trim();

            if (
                clean &&
                (
                    meaningfulWords(clean).length > 0 ||
                    getSmallTalk(clean)
                )
            ) {
                output.push(clean);
            }
        }
    }

    return output;
}
/* =====================================================
   8. د شمېرې له لارې د وړاندیز انتخاب
   ===================================================== */

function getNumericSelection(text) {
    const value = normalize(text);

    if (!/^[1-5]$/.test(value)) {
        return null;
    }

    return Number(value);
}

function answerSelectedChoice(number) {
    if (!pendingChoices.length) {
        return null;
    }

    const group = pendingChoices[0];

    if (!group || !Array.isArray(group.suggestions)) {
        pendingChoices.shift();
        return null;
    }

    const selected = group.suggestions[number - 1];

    if (!selected) {
        return {
            type: "answer",
            answer: "مهرباني وکړه، د ۱ او ۵ ترمنځ یوه موجوده شمېره وټاکه."
        };
    }

    pendingChoices.shift();

    return {
        type: "answer",
        answer: selected.answer,
        selectedQuestion: selected.question
    };
}

/* =====================================================
   9. د ځواب جوړول، د څو پوښتنو ملاتړ
   ===================================================== */

function getAnswer(userText) {
    const number = getNumericSelection(userText);

    /*
      که کاروونکي یوازې ۱، ۲، ۳، ۴ یا ۵ ولیکل،
      دا د لومړۍ نا حل شوې پوښتنې انتخاب ګڼل کېږي.
    */
    if (number !== null && pendingChoices.length > 0) {
        const selected = answerSelectedChoice(number);

        if (selected) {
            let answer = selected.answer;

            if (selected.selectedQuestion) {
                answer =
                    "ستاسې انتخاب: " + selected.selectedQuestion +
                    "\n\n" + answer;
            }

            if (pendingChoices.length > 0) {
                answer +=
                    "\n\nیادونه: لا هم " +
                    pendingChoices.length +
                    " نا حل شوې پوښتنه پاتې ده. د هغې د انتخاب لپاره ۱–۵ ولیکه.";
            }

            return answer;
        }
    }

    /*
      د نوې پوښتنې په راتلو سره پخواني انتخابونه پاکوو،
      څو زړې شمېرې له نوې پوښتنې سره ګډې نه شي.
    */
    pendingChoices = [];

    const questions = splitQuestions(userText);

    if (questions.length === 0) {
        return "مهرباني وکړه، یوه پوښتنه ولیکه.";
    }

    const results = questions.map(question =>
        resolveSingleQuestion(question)
    );

    const output = [];

    results.forEach((result, index) => {
        if (questions.length > 1) {
            output.push("پوښتنه " + (index + 1) + ": " + result.question);
        }

        if (result.type === "answer") {
            output.push(result.answer);
        } else if (result.type === "suggestions") {
            output.push(
                "ستا د پوښتنې لپاره څو نږدې موضوعات پیدا شول:"
            );

            result.suggestions.forEach((item, i) => {
                output.push((i + 1) + ". " + item.question);
            });

            pendingChoices.push({
                originalQuestion: result.question,
                suggestions: result.suggestions
            });

            output.push(
                "د دې پوښتنې د سم ځواب لپاره د پورته انتخابونو شمېره ولیکه."
            );
        } else {
            output.push(result.answer);
        }

        if (questions.length > 1 && index < results.length - 1) {
            output.push("");
        }
    });

    if (pendingChoices.length > 1) {
        output.push(
            "\nیادونه: د څو پوښتنو لپاره انتخابونه شته. " +
            "لومړی د لومړۍ نا حل شوې پوښتنې شمېره وټاکه؛ " +
            "وروسته به د بلې پوښتنې انتخاب ته ورسېږو."
        );
    }

    return output.join("\n");
}

/* =====================================================
   10. د خبرو او پیغامونو رسمول
   ===================================================== */

function escapeHTML(text) {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* =====================================================
   د ځواب ژوندی ټایپ کولو انیمېشن
   ===================================================== */

function typeWriter(element, fullText) {
    element.textContent = "";

    let index = 0;

    // د پښتو او عربي حروفو د سم ښودلو لپاره
    const characters = Array.from(fullText);

    // هر ځل څو توري ولیکل شي
    const speed = 18;

    function writeNext() {
        if (index >= characters.length) {
            return;
        }

        element.textContent += characters[index];
        index++;

        // د متن له لیکلو سره سکرین لاندې حرکت کوي
        scrollToBottom();

        setTimeout(writeNext, speed);
    }

    writeNext();
}

function renderMessage(message) {
    const isUser = message.role === "user";

    const wrapper = document.createElement("div");
    wrapper.className = "message " + (isUser ? "user" : "assistant");

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = isUser ? "👤" : "☪";

    const bubbleWrap = document.createElement("div");
    bubbleWrap.className = "bubble-wrap";

    const sender = document.createElement("div");
    sender.className = "sender";
    sender.textContent = isUser ? "تاسو" : "اسلامي پښتو AI";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = message.text || "";

    bubbleWrap.appendChild(sender);
    bubbleWrap.appendChild(bubble);

    wrapper.appendChild(avatar);
    wrapper.appendChild(bubbleWrap);

    messagesEl.appendChild(wrapper);

    // د مرستیال د ځواب لپاره د ټایپ کولو انیمېشن
    if (message.role === "assistant" && message.animate === true) {
        typeWriter(bubble, message.text || "");
    }
}

function renderChat() {
    messagesEl.innerHTML = "";

    const chat = getCurrentChat();

    if (!chat || chat.messages.length === 0) {
        welcomeEl.style.display = "flex";
    } else {
        welcomeEl.style.display = "none";

        chat.messages.forEach(message => {
            renderMessage(message);
        });
    }

    scrollToBottom();
}

function scrollToBottom() {
    requestAnimationFrame(() => {
        chatArea.scrollTop = chatArea.scrollHeight;
    });
}

function addMessage(role, text) {
    const chat = ensureChat();

    const message = {
    id: makeId(),
    role,
    text,
    time: now(),
    animate: role === "assistant"
};

    chat.messages.push(message);
    chat.updatedAt = now();

    if (
        role === "user" &&
        (chat.title === "نوې خبرې" || !chat.title)
    ) {
        chat.title = text.length > 32
            ? text.slice(0, 32) + "…"
            : text;
    }

    saveChats();
    renderChat();
    renderHistory();

    return message;
}

/* =====================================================
   11. د ټایپ کولو انیمېشن
   ===================================================== */

function showTyping() {
    const wrapper = document.createElement("div");
    wrapper.className = "message assistant";
    wrapper.id = "typingMessage";

    wrapper.innerHTML = `
        <div class="avatar">☪</div>
        <div class="bubble-wrap">
            <div class="sender">اسلامي پښتو AI</div>
            <div class="bubble">
                <div class="typing">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>
    `;

    messagesEl.appendChild(wrapper);
    scrollToBottom();
}

function removeTyping() {
    const typing = document.getElementById("typingMessage");

    if (typing) typing.remove();
}

/* =====================================================
   12. د پیغام لېږل
   ===================================================== */

async function sendMessage(text) {
    text = String(text || "").trim();

    if (!text || isBusy) return;

    isBusy = true;
    sendBtn.disabled = true;

    ensureChat();

    addMessage("user", text);

    userInput.value = "";
    autoResizeInput();

    showTyping();

    /*
      لنډ ځنډ یوازې د انیمېشن لپاره دی.
      اصلي ځوابونه د محلي معلوماتو له بانک څخه راځي.
    */
    await new Promise(resolve => setTimeout(resolve, 450));

    removeTyping();

    const answer = getAnswer(text);

    addMessage("assistant", answer);

    isBusy = false;
    sendBtn.disabled = false;
    userInput.focus();
}

/* =====================================================
   13. د تاریخچې رسمول او خلاصول
   ===================================================== */

function renderHistory() {
    historyList.innerHTML = "";

    if (chats.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-history";
        empty.textContent = "تر اوسه کومې خبرې نه شته.";
        historyList.appendChild(empty);
        return;
    }

    const sortedChats = [...chats].sort((a, b) =>
        new Date(b.updatedAt) - new Date(a.updatedAt)
    );

    sortedChats.forEach(chat => {
        const row = document.createElement("div");
        row.className = "history-item";

        const openButton = document.createElement("button");
        openButton.className =
            "history-open" +
            (chat.id === currentChatId ? " active" : "");

        openButton.textContent = chat.title;
        openButton.title = chat.title;

        openButton.addEventListener("click", () => {
            currentChatId = chat.id;
            pendingChoices = [];
            renderChat();
            renderHistory();
            closeSidebar();
        });

        const menuButton = document.createElement("button");
        menuButton.className = "history-menu";
        menuButton.textContent = "⋮";
        menuButton.setAttribute("aria-label", "د خبرو اختیارونه");

        menuButton.addEventListener("click", () => {
            showChatOptions(chat.id);
        });

        row.appendChild(openButton);
        row.appendChild(menuButton);

        historyList.appendChild(row);
    });
}

function showChatOptions(chatId) {
    const chat = chats.find(item => item.id === chatId);

    if (!chat) return;

    const action = prompt(
        "د خبرو لپاره یو انتخاب ولیکه:\n1 = نوم بدلول\n2 = حذف کول"
    );

    if (action === "1" || action === "۱") {
        renameChat(chatId);
    } else if (action === "2" || action === "۲") {
        deleteChat(chatId);
    }
}

function renameChat(chatId) {
    const chat = chats.find(item => item.id === chatId);

    if (!chat) return;

    const newName = prompt("د خبرو نوی نوم ولیکه:", chat.title);

    if (newName === null) return;

    const cleanName = newName.trim();

    if (!cleanName) {
        showToast("د خبرو نوم تش نه شي پاتې کېدای.");
        return;
    }

    chat.title = cleanName.slice(0, 80);
    chat.updatedAt = now();

    saveChats();
    renderHistory();
    showToast("د خبرو نوم بدل شو.");
}

function deleteChat(chatId) {
    const chat = chats.find(item => item.id === chatId);

    if (!chat) return;

    const confirmed = confirm(
        "ایا غواړې دا خبرې د تل لپاره حذف کړې؟"
    );

    if (!confirmed) return;

    chats = chats.filter(item => item.id !== chatId);

    if (currentChatId === chatId) {
        currentChatId = null;
        pendingChoices = [];

        if (chats.length > 0) {
            currentChatId = chats[0].id;
        } else {
            createChat();
        }
    }

    saveChats();
    renderChat();
    renderHistory();

    showToast("خبرې حذف شوې.");
}

/* =====================================================
   14. د مینو کنټرول
   ===================================================== */

function openSidebar() {
    sidebar.classList.add("open");
    overlay.classList.add("show");
}

function closeSidebar() {
    sidebar.classList.remove("open");
    overlay.classList.remove("show");
}

document.getElementById("menuBtn").addEventListener(
    "click", openSidebar
);

document.getElementById("closeMenuBtn").addEventListener(
    "click", closeSidebar
);

overlay.addEventListener("click", closeSidebar);

document.getElementById("newChatBtn").addEventListener(
    "click", createChat
);

document.getElementById("sidebarNewBtn").addEventListener(
    "click", createChat
);

document.getElementById("renameBtn").addEventListener("click", () => {
    const chat = getCurrentChat();

    if (!chat) {
        showToast("لومړی خبرې پیل کړه.");
        return;
    }

    renameChat(chat.id);
});

document.getElementById("deleteCurrentBtn").addEventListener("click", () => {
    const chat = getCurrentChat();

    if (!chat) {
        showToast("د حذف کولو لپاره خبرې نشته.");
        return;
    }

    deleteChat(chat.id);
});

/* د ټولو خبرو د حذف کولو تڼۍ */
document.getElementById("deleteAllBtn").addEventListener("click", () => {
    if (chats.length === 0) {
        showToast("د حذف کولو لپاره خبرې نشته.");
        return;
    }

    const confirmed = confirm(
        "ایا ډاډه یې چې ټولې خبرې حذف کړې؟ دا کار بېرته نه شي راګرځېدای."
    );

    if (!confirmed) return;

    chats = [];
    currentChatId = null;
    pendingChoices = [];

    saveChats();
    createChat();
    renderHistory();

    showToast("ټولې خبرې حذف شوې.");
});

/* =====================================================
   15. د متن ساحه او د لېږلو تڼۍ
   ===================================================== */

document.getElementById("chatForm").addEventListener("submit", event => {
    event.preventDefault();
    sendMessage(userInput.value);
});

userInput.addEventListener("input", autoResizeInput);

userInput.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage(userInput.value);
    }
});

function autoResizeInput() {
    userInput.style.height = "43px";

    const newHeight = Math.min(userInput.scrollHeight, 130);

    userInput.style.height = newHeight + "px";
}

/* د پیل پاڼې وړاندیزونه */

document.querySelectorAll(".suggestion-card").forEach(button => {
    button.addEventListener("click", () => {
        const question = button.getAttribute("data-question");

        if (question) {
            sendMessage(question);
        }
    });
});

/* =====================================================
   16. خبرتیا
   ===================================================== */

let toastTimer = null;

function showToast(message) {
    toastEl.textContent = message;
    toastEl.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
        toastEl.classList.remove("show");
    }, 2500);
}

/* =====================================================
   17. د اپلیکیشن پیل
   ===================================================== */

function initializeApp() {
    loadChats();

    if (chats.length > 0) {
        const sorted = [...chats].sort((a, b) =>
            new Date(b.updatedAt) - new Date(a.updatedAt)
        );

        currentChatId = sorted[0].id;
    } else {
        createChat();
    }

    renderChat();
    renderHistory();
}

initializeApp();

</script>
