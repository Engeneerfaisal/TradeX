<style>
:root {
    --green-dark: #0b5d3b;
    --green-main: #0f7b4f;
    --green-light: #1aa36f;
    --white: #ffffff;
    --gray-bg: #f2f2f2;
    --shadow: 0 10px 30px rgba(0,0,0,0.2);

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Tahoma, sans-serif;
}

body {
    background: linear-gradient(180deg, var(--green-dark), var(--green-main));
    min-height: 100vh;
}

header {
    background: var(--green-dark);
    color: var(--white);
    padding: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.menu {
    font-size: 26px;
    cursor: pointer;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    z-index: 100;
}

.side-menu {
    position: fixed;
    top: 0;
    left: -100%;
    width: 80%;
    height: 100%;
    background: white;
    transition: 0.3s;
    z-index: 101;
    padding: 20px;
}

.side-menu.active { left: 0; }

.menu-header {
    text-align: center;
    margin-bottom: 20px;
}

.menu-header img {
    width: 100%;
    height: 160px;
    border-radius: 50%;
}

.menu-btn {
    display: block;
    padding: 15px;
    background: var(--green-main);
    color: white;
    border-radius: 10px;
    text-align: center;
    margin-bottom: 10px;
    cursor: pointer;
}

/* ABOUT US */
.about {
    position: fixed;
    inset: 0;
    background: white;
    display: none;
    z-index: 200;
    padding: 20px;
}
.about h2 { color: var(--green-main); }
.about button {
    margin-top: 20px;
    padding: 10px;
    background: var(--green-main);
    color: white;
    border: none;
    border-radius: 10px;
}

.about img{
    display: block;
    width: 130px;
    height: 130px;
    margin: 20px auto;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #0f7b4f;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
}

.title {
    font-size: 22px;
    font-weight: bold;
}

.fav {
    font-size: 22px;
    cursor: pointer;
}

.search-box {
    background: var(--green-main);
    padding: 15px;
}

.search-container {
    background: rgba(255,255,255,0.25);
    border-radius: 10px;
    display: flex;
    align-items: center;
    padding: 10px;
}

.search-container input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-size: 16px;
    color: var(--white);
}

.search-container input::placeholder {
    color: #e0e0e0;
}

.search-container .icon {
    font-size: 20px;
    margin: 0 10px;
    cursor: pointer;
}

.lang-switch {
    display: flex;
    justify-content: center;
    gap: 30px;
    padding: 15px;
    color: var(--white);
}

.lang-switch label {
    cursor: pointer;
    font-size: 16px;
}

.content {
    background: var(--gray-bg);
    border-radius: 25px 25px 0 0;
    padding: 20px;
    min-height: 70vh;
}

.word-day {
    background: var(--green-main);
    color: var(--white);
    border-radius: 15px;
    padding: 15px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
}

.word-day-header {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
}

.word-day-main {
    margin-top: 15px;
    font-size: 26px;
    font-weight: bold;
}

.word-day-meaning {
    margin-top: 5px;
    font-size: 16px;
}

.result-card {
    background: var(--white);
    border-radius: 15px;
    padding: 15px;
    box-shadow: var(--shadow);
    margin-bottom: 15px;
}

.result-word {
    font-size: 22px;
    color: var(--green-dark);
    font-weight: bold;
}

.result-meaning {
    margin-top: 8px;
    font-size: 18px;
}

.result-example {
    margin-top: 8px;
    font-style: italic;
    color: #555;
}

.footer-btn {
    background: var(--green-main);
    color: var(--white);
    text-align: center;
    padding: 15px;
    border-radius: 15px;
    font-size: 22px;
    font-weight: bold;
    margin-top: 20px;
}
</style>

document.getElementById("searchInput").addEventListener("input", function() {
    const value = this.value.trim().toLowerCase();
    const mode = document.querySelector('input[name="lang"]:checked').value;
    const results = document.getElementById("results");
    results.innerHTML = "";

    if (!value) return; // که سرچ خالي وي، پاکه نتیجه

    dictionary.forEach(item => {
        let word = mode === "en2ps" ? item.en.toLowerCase() : item.ps;
        if (word.startsWith(value)) { // فلټر د سرچ پیل سره
            results.innerHTML += `
                <div class="result-card">
                    <div class="result-word">
                        ${mode === "en2ps" ? item.en : item.ps}
                    </div>
                    <div class="result-meaning">
                        ${mode === "en2ps" ? item.ps : item.en}
                    </div>
                    <div class="result-example">
                        ${item.example}
                    </div>
                </div>
            `;
        }
    });
});

function speak() {
    const text = document.getElementById("searchInput").value;
    if (!text) return;
    const utterance = new SpeechSynthesisUtterance(text);
    speechSynthesis.speak(utterance);
}

function openMenu(){
    document.querySelector(".overlay").style.display="block";
    sideMenu.classList.add("active");
}
function closeMenu(){
    document.querySelector(".overlay").style.display="none";
    sideMenu.classList.remove("active");
}

/* ABOUT */
function openAbout(){
    closeMenu();
    about.style.display="block";
}
function closeAbout(){
    about.style.display="none";
}
/* WORD OF DAY */
function setWordOfDay() {
    const index = Math.floor(Date.now() / 43200000) % dictionary.length;
    document.getElementById("wotdWord").innerText = dictionary[index].en;
    document.getElementById("wotdMeaning").innerText = dictionary[index].ps;
}
setWordOfDay();
