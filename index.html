<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اسلامي پښتو AI</title>

<style>
:root {
    --bg: #061a14;
    --panel: #0b281e;
    --panel2: #103629;
    --green: #18c78b;
    --green2: #0d9f6b;
    --text: #effff7;
    --muted: #a6c7b7;
    --border: rgba(255,255,255,.09);
    --danger: #ff6868;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Tahoma, sans-serif;
    min-height: 100vh;
}

button, input, textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    height: 100dvh;
    max-width: 1100px;
    margin: auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative; /* ⭐️ اضافه شد */
    background:
        radial-gradient(circle at top right, rgba(24,199,139,.07), transparent 35%),
        var(--bg);
}
/* HEADER */

.header {
    height: 64px;
    min-height: 64px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 15px;
    border-bottom: 1px solid var(--border);
    background: rgba(6,26,20,.95);
    flex-shrink: 0; /* ⭐️ اضافه شد */
    z-index: 5; /* ⭐️ اضافه شد */
}

.icon-btn {
    width: 42px;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--panel);
    color: var(--text);
    font-size: 21px;
    display: grid;
    place-items: center;
}

.logo {
    width: 39px;
    height: 39px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background: linear-gradient(145deg, #20d99a, #08744f);
    color: #03281b;
    font-size: 22px;
}

.header-title {
    flex: 1;
    min-width: 0;
}

.header-title h1 {
    font-size: 16px;
    font-weight: 700;
}

.header-title p {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
}

.status {
    width: 8px;
    height: 8px;
    display: inline-block;
    background: var(--green);
    border-radius: 50%;
    margin-left: 5px;
}

/* CHAT */

.chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 22px 16px 25px;
    min-height: 0; /* ⭐️ اضافه شد: بسیار مهم برای جلوگیری از به هم ریختگی */
}

.welcome {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px 0;
}

.welcome-logo {
    width: 78px;
    height: 78px;
    border-radius: 25px;
    display: grid;
    place-items: center;
    font-size: 40px;
    color: #042719;
    background: linear-gradient(145deg, #36e9aa, #08764f);
    box-shadow: 0 10px 40px rgba(24,199,139,.15);
    margin-bottom: 23px;
}

.welcome h2 {
    font-size: 25px;
    margin-bottom: 12px;
}

.welcome p {
    max-width: 440px;
    line-height: 1.9;
    font-size: 14px;
    color: var(--muted);
}

.suggestions-grid {
    width: 100%;
    max-width: 650px;
    margin-top: 28px;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 11px;
}

.suggestion-card {
    border: 1px solid var(--border);
    border-radius: 15px;
    background: linear-gradient(145deg, var(--panel), #091f17);
    padding: 15px;
    text-align: right;
    color: var(--text);
    line-height: 1.7;
    font-size: 13px;
    transition: .2s;
}

.suggestion-card:hover {
    border-color: var(--green);
    background: var(--panel2);
}

.suggestion-card span {
    display: block;
    font-size: 21px;
    margin-bottom: 7px;
}

/* MESSAGES */

.message {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 23px;
    animation: appear .25s ease;
}

.message.user {
    flex-direction: row-reverse;
}

.avatar {
    width: 35px;
    height: 35px;
    min-width: 35px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: var(--panel2);
    font-size: 17px;
}

.message.assistant .avatar {
    color: #05281b;
    background: var(--green);
}

.bubble-wrap {
    max-width: 85%;
    min-width: 0;
}

.sender {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 7px;
}

.bubble {
    padding: 13px 15px;
    border: 1px solid var(--border);
    border-radius: 16px;
    line-height: 2;
    font-size: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user .bubble {
    background: #104d38;
    border-color: rgba(24,199,139,.15);
    border-top-right-radius: 4px;
}

.assistant .bubble {
    background: #0b281e;
    border-top-left-radius: 4px;
}

.bubble strong {
    color: #54e9ae;
}

.typing {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 8px 0;
}

.typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    animation: bounce .8s infinite alternate;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

/* INPUT */

.input-area {
    padding: 12px 14px 15px;
    background: rgba(6,26,20,.98);
    border-top: 1px solid var(--border);
    flex-shrink: 0; /* ⭐️ اضافه شد: جلوگیری از فشرده شدن */
    z-index: 5; /* ⭐️ اضافه شد */
    position: relative; /* ⭐️ اضافه شد */
}

.input-box {
    max-width: 850px;
    margin: auto;
    display: flex;
    align-items: flex-end;
    gap: 9px;
    border: 1px solid #245340;
    border-radius: 18px;
    background: #0b281e;
    padding: 9px;
    transition: .2s;
}

.input-box:focus-within {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(24,199,139,.06);
}

#userInput {
    flex: 1;
    min-width: 0;
    max-height: 130px;
    min-height: 43px;
    resize: none;
    outline: none;
    border: none;
    background: transparent;
    color: var(--text);
    padding: 11px 8px;
    line-height: 1.7;
    font-size: 14px;
}

#userInput::placeholder {
    color: #83a998;
}

.send-btn {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    border: none;
    border-radius: 13px;
    background: var(--green);
    color: #03291c;
    font-size: 20px;
    font-weight: bold;
}

.send-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.footer-note {
    text-align: center;
    color: #759988;
    font-size: 10px;
    margin-top: 9px;
}

/* SIDEBAR */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 10;
    display: none;
}

.overlay.show {
    display: block;
}

.sidebar {
    position: fixed;
    z-index: 11;
    top: 0;
    bottom: 0;
    right: 0;
    width: min(320px, 86vw);
    background: #081f17;
    border-left: 1px solid var(--border);
    transform: translateX(105%);
    transition: transform .25s ease;
    display: flex;
    flex-direction: column;
}

.sidebar.open {
    transform: translateX(0);
}

.sidebar-header {
    padding: 19px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
}

.sidebar-header h2 {
    font-size: 17px;
}

.sidebar-actions {
    padding: 13px;
    display: grid;
    gap: 9px;
}

.side-btn {
    padding: 12px;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    text-align: right;
    display: flex;
    align-items: center;
    gap: 10px; /* فاصله بین آیکون و متن */
}

.side-btn svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
}

.side-btn.primary {
    background: var(--green);
    color: #03291c;
    font-weight: bold;
}

.history-title {
    padding: 10px 16px;
    font-size: 12px;
    color: var(--muted);
}

.history-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 10px 15px;
}

.history-item {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 7px;
}

.history-open {
    flex: 1;
    min-width: 0;
    padding: 11px;
    border-radius: 10px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text);
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
}

.history-open.active {
    background: #103629;
    border-color: rgba(24,199,139,.2);
}

.history-menu {
    width: 34px;
    height: 36px;
    border: none;
    background: transparent;
    color: var(--muted);
    border-radius: 8px;
    font-size: 19px;
}

.history-menu:hover {
    background: var(--panel2);
}

.empty-history {
    text-align: center;
    padding: 25px 10px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.8;
}

.toast {
    position: fixed;
    z-index: 30;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: #174633;
    color: white;
    border: 1px solid #28644a;
    padding: 11px 17px;
    border-radius: 12px;
    font-size: 13px;
    display: none;
    max-width: 90%;
    text-align: center;
}

.toast.show {
    display: block;
    animation: appear .2s ease;
}

/* مودال سفارشی */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    z-index: 40;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    background: #0b281e;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    max-width: 400px;
    width: 100%;
    animation: appear .2s ease;
}

.modal h3 {
    font-size: 16px;
    margin-bottom: 14px;
    color: var(--text);
}

.modal input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #061a14;
    color: var(--text);
    margin-bottom: 14px;
    outline: none;
}

.modal input:focus {
    border-color: var(--green);
}

.modal-actions {
    display: flex;
    gap: 9px;
    justify-content: flex-start;
}

.modal-btn {
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 13px;
}

.modal-btn.primary {
    background: var(--green);
    color: #03291c;
    font-weight: bold;
    border: none;
}

.modal-btn.danger {
    background: var(--danger);
    color: white;
    border: none;
}

/* ⭐️ منوی سه نقطه چت با آیکون‌های SVG */
.chat-dropdown {
    position: fixed;
    z-index: 50;
    background: #0b281e;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    padding: 6px;
    display: none;
    flex-direction: column;
    min-width: 150px;
    animation: appear 0.15s ease;
}

.chat-dropdown.show {
    display: flex;
}

.chat-dropdown button {
    background: transparent;
    border: none;
    color: var(--text);
    padding: 10px 12px;
    text-align: right;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    transition: 0.2s;
}

.chat-dropdown button:hover {
    background: var(--panel2);
}

.chat-dropdown button svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.chat-dropdown button.danger {
    color: var(--danger);
}

.chat-dropdown button.danger:hover {
    background: rgba(255, 104, 104, 0.1);
}

@keyframes appear {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes bounce {
    from { transform: translateY(0); opacity: .5; }
    to { transform: translateY(-5px); opacity: 1; }
}

@media (max-width: 520px) {
    .header {
        padding: 0 10px;
        gap: 8px;
    }

    .header-title h1 {
        font-size: 14px;
    }

    .header-title p {
        font-size: 10px;
    }

    .chat-area {
        padding: 18px 11px;
    }

    .welcome h2 {
        font-size: 22px;
    }

    .suggestions-grid {
        gap: 8px;
    }

    .suggestion-card {
        padding: 11px;
        font-size: 12px;
    }

    .bubble-wrap {
        max-width: 88%;
    }

    .bubble {
        font-size: 13px;
        padding: 11px 12px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <button class="icon-btn" id="menuBtn" aria-label="مینو">☰</button>

        <div class="logo">☪</div>

        <div class="header-title">
            <h1>اسلامي پښتو AI</h1>
            <p><span class="status"></span> محلي اسلامي مرستیال</p>
        </div>

        <button class="icon-btn" id="newChatBtn" aria-label="نوې خبرې">＋</button>
    </header>

    <main class="chat-area" id="chatArea">
        <section class="welcome" id="welcome">
            <div class="welcome-logo">☪</div>
            <h2>السلام علیکم!</h2>
            <p>
                اسلامي پښتو مرستیال ته ښه راغلاست.
                خپله پوښتنه ولیکئ؛ زه به د موجودو معلوماتو له مخې
                د ځواب هڅه وکړم.
            </p>

            <div class="suggestions-grid">
                <button class="suggestion-card" data-question="اسلام څه شی دی؟">
                    <span>📖</span>
                    اسلام څه شی دی؟
                </button>

                <button class="suggestion-card" data-question="قرآن کریم څه شی دی؟">
                    <span>📗</span>
                    قرآن کریم څه شی دی؟
                </button>

                <button class="suggestion-card" data-question="د اسلام پنځه ارکان کوم دي؟">
                    <span>🕌</span>
                    د اسلام پنځه ارکان
                </button>

                <button class="suggestion-card" data-question="اودس څنګه کیږي؟">
                    <span>💧</span>
                    د اوداسه طریقه
                </button>
            </div>
        </section>

        <div id="messages"></div>
    </main>

    <footer class="input-area">
        <form class="input-box" id="chatForm">
            <textarea
                id="userInput"
                rows="1"
                placeholder="خپله پوښتنه دلته ولیکئ..."
                aria-label="خپله پوښتنه ولیکئ"
            ></textarea>

            <button class="send-btn" id="sendBtn" type="submit" aria-label="لېږل">
                ➤
            </button>
        </form>

        <div class="footer-note">
            د مهمو شرعي مسایلو لپاره له باوري عالم سره هم مشوره وکړئ.
        </div>
    </footer>

</div>

<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <h2>☪ د خبرو تاریخچه</h2>
        <button class="icon-btn" id="closeMenuBtn" aria-label="بندول">×</button>
    </div>

    <div class="sidebar-actions">
        <button class="side-btn primary" id="sidebarNewBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            نوې خبرې
        </button>
        <button class="side-btn" id="renameBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
            د خبرو نوم بدلول
        </button>
        <button class="side-btn" id="deleteCurrentBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            دا خبرې حذف کول
        </button>
        <button class="side-btn" id="deleteAllBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            حذف ټولې خبرې
        </button>
    </div>

    <div class="history-title">پخوانۍ خبرې</div>
    <div class="history-list" id="historyList"></div>
</aside>

<div class="toast" id="toast"></div>

<!-- ⭐️ منوی شناور با آیکون‌های SVG ظریف -->
<div class="chat-dropdown" id="chatDropdown">
    <button id="dropdownRenameBtn">
        <svg viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
        نوم بدلول
    </button>
    <button id="dropdownDeleteBtn" class="danger">
        <svg viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        حذف کول
    </button>
</div>

<!-- مودال سفارشی -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h3 id="modalTitle"></h3>
        <input type="text" id="modalInput" />
        <div class="modal-actions" id="modalActions"></div>
    </div>
</div>

<script>
"use strict";

/* =====================================================
   1. د اسلامي معلوماتو محلي بانک
   ===================================================== */

const knowledgeBase = [

{
    id: 1,
    question: "اسلام څه شی دی",
    keywords: ["اسلام", "دین", "مسلمان", "اسلام تعریف"],
    answer:
"اسلام د الله تعالی د یووالي منل، د هغه عبادت کول او د هغه د رسولانو پیروي کول دي. د اسلام اساسي پیغام د الله تعالی عبادت، نېک عمل، عدالت، رحمت او د خلکو د حقونو مراعاتول دي."
},

{
    id: 2,
    question: "قرآن کریم څه شی دی",
    keywords: ["قرآن", "قران", "قرآن کریم", "کتاب الله", "اسماني کتاب"],
    answer:
"قرآن کریم د اسلام سپېڅلی کتاب دی چې مسلمانان یې د الله تعالی کلام بولي. دا د حضرت محمد ﷺ پر زړه نازل شوی. قرآن کریم ۱۱۴ سورتونه لري. د آیتونو د دقیق شمېر او تفسیر په اړه باید باوري قرآني سرچینو ته مراجعه وشي."
},

{
    id: 3,
    question: "حضرت محمد ﷺ څوک و",
    keywords: ["محمد", "رسول الله", "پیغمبر", "نبي", "حضرت محمد"],
    answer:
"حضرت محمد ﷺ د اسلام وروستی پیغمبر دی. مسلمانان پر هغه ایمان لري او د هغه سنت د خپل ژوند لپاره لارښود ګڼي. هغه په مکه مکرمه کې زېږېدلی او وروسته مدینې منورې ته هجرت کړی."
},

{
    id: 4,
    question: "د اسلام پنځه ارکان کوم دي",

function makeId() {

function loadChats() {

}

/* =====================================================
   3. د متن پاکول او د پښتو عددونو پېژندل
   ===================================================== */

function convertDigitsToEnglish(text) {
    const map = {
        "۰": "0", "۱": "1", "۲": "2", "۳": "3", "۴": "4",
        "۵": "5", "۶": "6", "۷": "7", "۸": "8", "۹": "9"
    };
    return String(text).replace(/[۰-۹]/g, digit => map[digit]);
}

function normalize(text) {
    return convertDigitsToEnglish(String(text || ""))
        .toLowerCase()
        .replace(/[ًٌٍَُِّْٰـ]/g, "")
        .replace(/[إأآٱ]/g, "ا")
        .replace(/ى/g, "ي")
        .replace(/ک/g, "ك")
        .replace(/ي/g, "ی")
        .replace(/ة/g, "ه")
        .replace(/[؟?!.,،؛:()[\]{}"'«»ـ\-]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}

function tokenize(text) {
    return normalize(text).split(/\s+/).filter(Boolean);
}

const stopWords = new Set([
    "څه", "څوک", "څنګه", "ولې", "چیرته", "کوم", "کومه",
    "دی", "ده", "دي", "شو", "شي", "کوي", "کړي", "کړه",
    "د", "په", "کې", "له", "نه", "او", "یا", "را", "زه",
    "ته", "تاسو", "موږ", "زما", "ستا", "ستاسو", "یې",
    "دا", "هغه", "هم", "خو", "چې", "به", "و", "وو",
    "لري", "لره", "رانه", "مهرباني",
    "ماته", "راته", "وایه", "ووایه", "تشریح", "کړئ",
    "معنی", "مطلب", "تعریف", "کومې"
]);

function meaningfulWords(text) {
    return tokenize(text).filter(word =>
        word.length > 1 && !stopWords.has(word)
    );
}

/* =====================================================
   4. د ورته والي حساب
   ===================================================== */

function similarity(a, b) {
    const wordsA = new Set(meaningfulWords(a));
    const wordsB = new Set(meaningfulWords(b));

    if (wordsA.size === 0 || wordsB.size === 0) return 0;

    let intersection = 0;
    for (const word of wordsA) {
        if (wordsB.has(word)) intersection++;
    }

    const union = new Set([...wordsA, ...wordsB]).size;
    const jaccard = intersection / union;
    const coverageA = intersection / wordsA.size;
    const coverageB = intersection / wordsB.size;

    return Math.max(jaccard, coverageA * 0.85, coverageB * 0.85);
}

function levenshtein(a, b) {
    a = String(a);
    b = String(b);
    if (a === b) return 0;
    if (!a.length) return b.length;
    if (!b.length) return a.length;

    const matrix = [];
    for (let i = 0; i <= b.length; i++) matrix[i] = [i];
    for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

    for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
            if (b.charAt(i - 1) === a.charAt(j - 1)) {
                matrix[i][j] = matrix[i - 1][j - 1];
            } else {
                matrix[i][j] = Math.min(
                    matrix[i - 1][j - 1] + 1,
                    matrix[i][j - 1] + 1,
                    matrix[i - 1][j] + 1
                );
            }
        }
    }
    return matrix[b.length][a.length];
}

function scoreEntry(query, entry) {
    const q = normalize(query);
    const mainQuestion = normalize(entry.question);

    if (q === mainQuestion) return 1;

    const queryWords = q.split(/\s+/).filter(Boolean);
    if (queryWords.length === 0) return 0;

    const meaningfulQueryWords = meaningfulWords(q);
    const queryWordSet = new Set(queryWords);

    let score = similarity(q, entry.question);

    for (const keyword of (entry.keywords || [])) {
        const k = normalize(keyword);
        if (!k) continue;

        if (q === k) {
            score = Math.max(score, 1);
            continue;
        }

        const keywordWords = k.split(/\s+/).filter(Boolean);
        if (keywordWords.length === 0) continue;

        const allMatched = keywordWords.every(kw => queryWordSet.has(kw));

        if (allMatched) {
            const meaningfulCount = meaningfulQueryWords.length;
            const keywordMeaningfulCount = keywordWords.filter(kw =>
                !stopWords.has(kw)
            ).length;

            const extraMeaningful = meaningfulCount - keywordMeaningfulCount;

            if (extraMeaningful >= 2) {
                score = Math.max(score, 0.3);
            } else if (extraMeaningful === 1) {
                score = Math.max(score, 0.55);
            } else {
                const ratio = keywordWords.length / queryWords.length;
                if (ratio >= 0.5) {
                    score = Math.max(score, 0.94);
                } else {
                    score = Math.max(score, 0.85);
                }
            }
        }
    }

    return score;
}

function findMatches(query) {
    return knowledgeBase
        .map(entry => ({ entry, score: scoreEntry(query, entry) }))
        .sort((a, b) => b.score - a.score);
}

/* =====================================================
   5. د سلام او عامو خبرو پېژندل
   ===================================================== */

function getSmallTalk(query) {
    const q = normalize(query);
    if (!q) return null;

    const words = q.split(/\s+/).filter(Boolean);
    if (words.length === 0) return null;

    const greetingWords = new Set([
        "سلام", "سلامونه", "علیکم", "علیکم", "salam", "السلام"
    ]);

    const exactGreetings = [
        "سلام", "سلامونه", "السلام علیکم",
        "سلام علیکم", "وعلیکم السلام", "salam"
    ];
    if (exactGreetings.some(g => q === normalize(g))) {
        return "وعلیکم السلام ورحمة الله وبرکاته! ښه راغلاست. خپله پوښتنه ولیکه، زه به د موجودو معلوماتو له مخې مرسته درسره وکړم.";
    }

    if (words.length <= 3 && words.every(w => greetingWords.has(w))) {
        return "وعلیکم السلام ورحمة الله وبرکاته! ښه راغلاست. خپله پوښتنه ولیکه، زه به د موجودو معلوماتو له مخې مرسته درسره وکړم.";
    }

    if (words.length === 1) {
        const word = words[0];
        if (word.length >= 2 && word.length <= 6) {
            const dist = levenshtein(word, "سلام");
            if (dist <= 1) {
                return "وعلیکم السلام ورحمة الله وبرکاته! ښه راغلاست. خپله پوښتنه ولیکه، زه به د موجودو معلوماتو له مخې مرسته درسره وکړم.";
            }
        }
    }

    const exactThanks = ["مننه", "ډیره مننه", "ډېره مننه", "تشکر", "ډیر تشکر", "ډېر تشکر"];
    if (exactThanks.some(t => q === normalize(t))) {
        return "هر کله! الله تعالی دې درته خیر او برکت درکړي.";
    }
    if (words.length === 1) {
        const word = words[0];
        if (word.length >= 3 && word.length <= 6) {
            if (levenshtein(word, "مننه") <= 1 || levenshtein(word, "تشکر") <= 1) {
                return "هر کله! الله تعالی دې درته خیر او برکت درکړي.";
            }
        }
    }

    const howAreYou = ["ته څنګه یې", "څنګه یې", "څنګه یاست"];
    if (howAreYou.some(h => q === normalize(h))) {
        return "مننه! زه چمتو یم چې ستا پوښتنو ته د موجودو معلوماتو له مخې ځواب ووایم.";
    }

    return null;
}

/* =====================================================
   6. د یوې پوښتنې حل کول
   ===================================================== */

function resolveSingleQuestion(question) {
    const q = normalize(question);
    if (!q) return { type: "unknown", question, answer: "" };

    const smallTalk = getSmallTalk(q);
    if (smallTalk) {
        return { type: "answer", question, answer: smallTalk };
    }

    const matches = findMatches(q);
    const best = matches[0];

    if (best && best.score >= 0.76) {
        return {
            type: "answer",
            question,
            answer: best.entry.answer,
            entryId: best.entry.id
        };
    }

    const suggestions = matches
        .filter(item => item.score >= 0.22)
        .slice(0, 5)
        .map(item => ({
            id: item.entry.id,
            question: item.entry.question,
            answer: item.entry.answer,
            score: item.score
        }));

    if (suggestions.length > 0) {
        return { type: "suggestions", question, suggestions };
    }

    return {
        type: "unknown",
        question,
        answer:
"بښنه غواړم، د دې پوښتنې لپاره په محلي معلوماتو کې مناسب ځواب پیدا نه شو. پوښتنه لږه روښانه ولیکه یا یې په بل ډول بیان کړه."
    };
}

/* =====================================================
   7. په یوه پیغام کې د څو پوښتنو جلا کول
   ===================================================== */

function splitQuestions(text) {
    const input = String(text || "").trim();
    if (!input) return [];

    const parts = input
        .split(/[؟?!؛;\n]+/)
        .map(part => part.trim())
        .filter(Boolean);

    const starters = [
        "اسلام", "قرآن", "قران", "الله", "رسول", "محمد", "ایمان",
        "لمونځ", "نماز", "اودس", "روژه", "زکات", "حج", "جنت",
        "دوزخ", "حدیث", "سنت", "توبه", "دعا", "استغفار",
        "مسلمان", "هجرت", "صدقه", "اخلاق", "درود", "حلال",
        "حرام", "جمعه", "اختر", "سورت", "سوره", "مور", "پلار", "ذکر"
    ];

    const output = [];

    for (const part of parts) {
        let segments = [part];

        for (const starter of starters) {
            const nextSegments = [];
            for (const segment of segments) {
                const escaped = starter.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                const regex = new RegExp("\\s+(?:او)\\s+(?=" + escaped + ")", "g");
                nextSegments.push(...segment.split(regex));
            }
            segments = nextSegments;
        }

        for (const segment of segments) {
            const clean = segment.trim();
            if (clean && (meaningfulWords(clean).length > 0 || getSmallTalk(clean))) {
                output.push(clean);
            }
        }
    }

    return output;
}

/* =====================================================
   8. د شمېرې له لارې د وړاندیز انتخاب
   ===================================================== */

function getNumericSelection(text) {
    const value = normalize(text);
    if (!/^[1-5]$/.test(value)) return null;
    return Number(value);
}

function answerSelectedChoice(number) {
    if (!pendingChoices.length) return null;

    const group = pendingChoices[0];
    if (!group || !Array.isArray(group.suggestions)) {
        pendingChoices.shift();
        return {
            type: "answer",
            answer: "د دې پوښتنې لپاره نور انتخابونه نشته. مهرباني وکړه بیا پوښتنه ولیکه."
        };
    }

    const selected = group.suggestions[number - 1];

    if (!selected) {
        return {
            type: "answer",
            answer: "مهرباني وکړه، د ۱ او ۵ ترمنځ یوه موجوده شمېره وټاکه."
        };
    }

    pendingChoices.shift();

    return {
        type: "answer",
        answer: selected.answer,
        selectedQuestion: selected.question
    };
}

/* =====================================================
   9. د ځواب جوړول
   ===================================================== */

function getAnswer(userText) {
    const number = getNumericSelection(userText);

    if (number !== null && pendingChoices.length > 0) {
        const selected = answerSelectedChoice(number);
        if (selected) {
            let answer = selected.answer;
            if (selected.selectedQuestion) {
                answer =
                    "ستاسې انتخاب: " + selected.selectedQuestion +
                    "\n\n" + answer;
            }
            if (pendingChoices.length > 0) {
                answer +=
                    "\n\nیادونه: لا هم " + pendingChoices.length +
                    " نا حل شوې پوښتنه پاتې ده. د هغې د انتخاب لپاره ۱–۵ ولیکه.";
            }
            return answer;
        }
    }

    pendingChoices = [];

    const questions = splitQuestions(userText);
    if (questions.length === 0) {
        return "مهرباني وکړه، یوه پوښتنه ولیکه.";
    }

    const results = questions.map(q => resolveSingleQuestion(q));
    const output = [];

    results.forEach((result, index) => {
        if (questions.length > 1) {
            output.push("پوښتنه " + (index + 1) + ": " + result.question);
        }

        if (result.type === "answer") {
            output.push(result.answer);
        } else if (result.type === "suggestions") {
            output.push("ستا د پوښتنې لپاره څو نږدې موضوعات پیدا شول:");
            result.suggestions.forEach((item, i) => {
                output.push((i + 1) + ". " + item.question);
            });
            pendingChoices.push({
                originalQuestion: result.question,
                suggestions: result.suggestions
            });
            output.push("د دې پوښتنې د سم ځواب لپاره د پورته انتخابونو شمېره ولیکه.");
        } else {
            output.push(result.answer);
        }

        if (questions.length > 1 && index < results.length - 1) {
            output.push("");
        }
    });

    if (pendingChoices.length > 1) {
        output.push(
            "\nیادونه: د څو پوښتنو لپاره انتخابونه شته. " +
            "لومړی د لومړۍ نا حل شوې پوښتنې شمېره وټاکه؛ " +
            "وروسته به د بلې پوښتنې انتخاب ته ورسېږو."
        );
    }

    return output.join("\n");
}

/* =====================================================
   10. typeWriter
   ===================================================== */

function typeWriter(element, fullText, token) {
    element.textContent = "";
    const characters = Array.from(fullText);
    const speed = 18;
    let index = 0;
    let scrollCounter = 0;

    function writeNext() {
        if (token !== typeWriterToken || !element.isConnected) return;
        if (index >= characters.length) return;

        element.textContent += characters[index];
        index++;

        scrollCounter++;
        if (scrollCounter >= 4) {
            scrollCounter = 0;
            scrollToBottom();
        }

        setTimeout(writeNext, speed);
    }

    writeNext();
}

function renderMessage(message) {
    const isUser = message.role === "user";

    const wrapper = document.createElement("div");
    wrapper.className = "message " + (isUser ? "user" : "assistant");

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = isUser ? "👤" : "☪";

    const bubbleWrap = document.createElement("div");
    bubbleWrap.className = "bubble-wrap";

    const sender = document.createElement("div");
    sender.className = "sender";
    sender.textContent = isUser ? "تاسو" : "اسلامي پښتو AI";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubbleWrap.appendChild(sender);
    bubbleWrap.appendChild(bubble);

    wrapper.appendChild(avatar);
    wrapper.appendChild(bubbleWrap);
    messagesEl.appendChild(wrapper);

    if (message.role === "assistant" && message.animate === true) {
        message.animate = false;
        typeWriter(bubble, message.text || "", typeWriterToken);
    } else {
        bubble.textContent = message.text || "";
    }
}

function renderChat() {
    typeWriterToken++;

    messagesEl.innerHTML = "";

    const chat = getCurrentChat();

    if (!chat || chat.messages.length === 0) {
        welcomeEl.style.display = "flex";
    } else {
        welcomeEl.style.display = "none";
        chat.messages.forEach(message => renderMessage(message));
    }

    scrollToBottom();
}

function scrollToBottom() {
    requestAnimationFrame(() => {
        chatArea.scrollTop = chatArea.scrollHeight;
    });
}

function addMessage(role, text) {
    const chat = ensureChat();

    const message = {
        id: makeId(),
        role,
        text,
        time: now(),
        animate: role === "assistant"
    };

    chat.messages.push(message);
    chat.updatedAt = now();

    if (role === "user" && (chat.title === "نوې خبرې" || !chat.title)) {
        chat.title = text.length > 32 ? text.slice(0, 32) + "…" : text;
    }

    saveChats();
    renderChat();
    renderHistory();

    return message;
}

/* =====================================================
   11. د ټایپ کولو انیمېشن
   ===================================================== */

function showTyping() {
    const wrapper = document.createElement("div");
    wrapper.className = "message assistant";
    wrapper.id = "typingMessage";

    wrapper.innerHTML = `
        <div class="avatar">☪</div>
        <div class="bubble-wrap">
            <div class="sender">اسلامي پښتو AI</div>
            <div class="bubble">
                <div class="typing">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>
    `;

    messagesEl.appendChild(wrapper);
    scrollToBottom();
}

function removeTyping() {
    const typing = document.getElementById("typingMessage");
    if (typing) typing.remove();
}

/* =====================================================
   12. د پیغام لېږل
   ===================================================== */

async function sendMessage(text) {
    text = String(text || "").trim();
    if (!text || isBusy) return;

    isBusy = true;
    sendBtn.disabled = true;

    ensureChat();
    addMessage("user", text);

    userInput.value = "";
    userInput.blur(); // ⭐️ بستن کیبورد
    autoResizeInput();

    showTyping();

    await new Promise(resolve => setTimeout(resolve, 450));

    removeTyping();

    const answer = getAnswer(text);
    addMessage("assistant", answer);

    isBusy = false;
    sendBtn.disabled = false;
}

/* =====================================================
   13. د تاریخچې رسمول
   ===================================================== */

function renderHistory() {
    historyList.innerHTML = "";

    if (chats.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-history";
        empty.textContent = "تر اوسه کومې خبرې نه شته.";
        historyList.appendChild(empty);
        return;
    }

    const sortedChats = [...chats].sort((a, b) =>
        new Date(b.updatedAt) - new Date(a.updatedAt)
    );

    sortedChats.forEach(chat => {
        const row = document.createElement("div");
        row.className = "history-item";

        const openButton = document.createElement("button");
        openButton.className =
            "history-open" + (chat.id === currentChatId ? " active" : "");
        openButton.textContent = chat.title;
        openButton.title = chat.title;

        openButton.addEventListener("click", () => {
            currentChatId = chat.id;
            pendingChoices = [];
            renderChat();
            renderHistory();
            closeSidebar();
        });

        const menuButton = document.createElement("button");
        menuButton.className = "history-menu";
        menuButton.textContent = "⋮";
        menuButton.setAttribute("aria-label", "د خبرو اختیارونه");

        menuButton.addEventListener("click", (event) => {
            event.stopPropagation();
            showChatOptions(chat.id, event);
        });

        row.appendChild(openButton);
        row.appendChild(menuButton);
        historyList.appendChild(row);
    });
}

/* =====================================================
   14. منوی شناور و مودال سفارشی
   ===================================================== */

function showChatOptions(chatId, event) {
    dropdownChatId = chatId;
    const button = event.currentTarget;
    const rect = button.getBoundingClientRect();
    
    chatDropdown.style.display = "flex";
    chatDropdown.style.top = (rect.bottom + window.scrollY + 5) + "px";
    chatDropdown.style.left = (rect.left + window.scrollX) + "px";
}

function hideChatDropdown() {
    chatDropdown.style.display = "none";
    dropdownChatId = null;
}

document.addEventListener("click", (e) => {
    if (!chatDropdown.contains(e.target) && !e.target.closest(".history-menu")) {
        hideChatDropdown();
    }
});

dropdownRenameBtn.addEventListener("click", async () => {
    if (dropdownChatId) {
        const idToEdit = dropdownChatId;
        hideChatDropdown();
        await renameChat(idToEdit);
    }
});

dropdownDeleteBtn.addEventListener("click", async () => {
    if (dropdownChatId) {
        const idToDelete = dropdownChatId;
        hideChatDropdown();
        await deleteChat(idToDelete);
    }
});

const modalOverlay = document.getElementById("modalOverlay");
const modalTitle = document.getElementById("modalTitle");
const modalInput = document.getElementById("modalInput");
const modalActions = document.getElementById("modalActions");

let modalResolve = null;

function closeModal(value) {
    modalOverlay.classList.remove("show");
    modalInput.value = "";
    if (modalResolve) {
        const resolve = modalResolve;
        modalResolve = null;
        resolve(value);
    }
}

function askText(title, defaultValue) {
    return new Promise(resolve => {
        modalTitle.textContent = title;
        modalInput.style.display = "block";
        modalInput.value = defaultValue || "";
        modalActions.innerHTML = "";
        modalResolve = resolve;

        const cancelBtn = document.createElement("button");
        cancelBtn.className = "modal-btn";
        cancelBtn.textContent = "لغو";
        cancelBtn.addEventListener("click", () => closeModal(null));

        const okBtn = document.createElement("button");
        okBtn.className = "modal-btn primary";
        okBtn.textContent = "تایید";
        okBtn.addEventListener("click", () => {
            closeModal(modalInput.value);
        });

        modalActions.appendChild(okBtn);
        modalActions.appendChild(cancelBtn);

        modalOverlay.classList.add("show");

        setTimeout(() => {
            modalInput.focus();
            modalInput.select();
        }, 50);
    });
}

function askConfirm(title) {
    return new Promise(resolve => {
        modalTitle.textContent = title;
        modalInput.style.display = "none";
        modalInput.value = "";
        modalActions.innerHTML = "";
        modalResolve = (val) => resolve(val === true);

        const cancelBtn = document.createElement("button");
        cancelBtn.className = "modal-btn";
        cancelBtn.textContent = "لغو";
        cancelBtn.addEventListener("click", () => closeModal(false));

        const okBtn = document.createElement("button");
        okBtn.className = "modal-btn danger";
        okBtn.textContent = "تایید";
        okBtn.addEventListener("click", () => closeModal(true));

        modalActions.appendChild(okBtn);
        modalActions.appendChild(cancelBtn);

        modalOverlay.classList.add("show");
    });
}

modalOverlay.addEventListener("click", event => {
    if (event.target === modalOverlay) {
        closeModal(null);
    }
});

/* =====================================================
   15. مدیریت چت‌ها
   ===================================================== */

async function renameChat(chatId) {
    const chat = chats.find(item => item.id === chatId);
    if (!chat) return;

    const newName = await askText("د خبرو نوی نوم ولیکه:", chat.title);
    if (newName === null) return;

    const cleanName = newName.trim();
    if (!cleanName) {
        showToast("د خبرو نوم تش نه شي پاتې کېدای.");
        return;
    }

    chat.title = cleanName.slice(0, 80);
    chat.updatedAt = now();

    saveChats();
    renderHistory();
    showToast("د خبرو نوم بدل شو.");
}

async function deleteChat(chatId) {
    const chat = chats.find(item => item.id === chatId);
    if (!chat) return;

    const confirmed = await askConfirm("ایا غواړې دا خبرې د تل لپاره حذف کړې؟");
    if (!confirmed) return;

    chats = chats.filter(item => item.id !== chatId);

    if (currentChatId === chatId) {
        currentChatId = null;
        pendingChoices = [];

        if (chats.length > 0) {
            currentChatId = chats[0].id;
        } else {
            createChat(true);
        }
    }

    saveChats();
    renderChat();
    renderHistory();
    showToast("خبرې حذف شوې.");
}

/* =====================================================
   16. د مینو کنټرول
   ===================================================== */

function openSidebar() {
    sidebar.classList.add("open");
    overlay.classList.add("show");
}

function closeSidebar() {
    sidebar.classList.remove("open");
    overlay.classList.remove("show");
}

document.getElementById("menuBtn").addEventListener("click", openSidebar);
document.getElementById("closeMenuBtn").addEventListener("click", closeSidebar);
overlay.addEventListener("click", closeSidebar);

document.getElementById("newChatBtn").addEventListener("click", () => createChat());
document.getElementById("sidebarNewBtn").addEventListener("click", () => createChat());

document.getElementById("renameBtn").addEventListener("click", () => {
    const chat = getCurrentChat();
    if (!chat) {
        showToast("لومړی خبرې پیل کړه.");
        return;
    }
    renameChat(chat.id);
});

document.getElementById("deleteCurrentBtn").addEventListener("click", () => {
    const chat = getCurrentChat();
    if (!chat) {
        showToast("د حذف کولو لپاره خبرې نشته.");
        return;
    }
    deleteChat(chat.id);
});

document.getElementById("deleteAllBtn").addEventListener("click", async () => {
    if (chats.length === 0) {
        showToast("د حذف کولو لپاره خبرې نشته.");
        return;
    }

    const confirmed = await askConfirm(
        "ایا ډاډه یې چې ټولې خبرې حذف کړې؟ دا کار بېرته نه شي راګرځېدای."
    );
    if (!confirmed) return;

    chats = [];
    currentChatId = null;
    pendingChoices = [];

    createChat(true);
    saveChats();
    renderChat();
    renderHistory();

    showToast("ټولې خبرې حذف شوې.");
});

/* =====================================================
   17. د متن ساحه او د لېږلو تڼۍ
   ===================================================== */

document.getElementById("chatForm").addEventListener("submit", event => {
    event.preventDefault();
    sendMessage(userInput.value);
});

userInput.addEventListener("input", autoResizeInput);

userInput.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage(userInput.value);
    }
});

function autoResizeInput() {
    const minHeight = 43;
    userInput.style.height = minHeight + "px";

    const newHeight = Math.min(userInput.scrollHeight, 130);
    userInput.style.height = newHeight + "px";
}

document.querySelectorAll(".suggestion-card").forEach(button => {
    button.addEventListener("click", () => {
        const question = button.getAttribute("data-question");
        if (question) {
            userInput.blur(); // ⭐️ بستن کیبورد
            sendMessage(question);
        }
    });
});

/* =====================================================
   18. خبرتیا
   ===================================================== */

let toastTimer = null;

function showToast(message) {
    toastEl.textContent = message;
    toastEl.classList.add("show");

    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        toastEl.classList.remove("show");
    }, 2500);
}

/* =====================================================
   19. د اپلیکیشن پیل
   ===================================================== */

function initializeApp() {
    loadChats();

    // ⭐️ ۱. حل مشکل انیمیشن: اگر اپ رفرش شد، پیام‌های قبلی دیگر تایپ نشوند
    chats.forEach(chat => {
        if (chat.messages && chat.messages.length > 0) {
            chat.messages.forEach(msg => {
                msg.animate = false; 
            });
        }
    });

    // ⭐️ ۲. حل مشکل چت جدید: همیشه یک چت خالی جدید در شروع بساز
    const newChat = createChat(true);
    currentChatId = newChat.id;
    saveChats();

    renderChat();
    renderHistory();
}

initializeApp();
